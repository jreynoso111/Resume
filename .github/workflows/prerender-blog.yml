name: Prerender blog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/prerender_blog.py"
      - "js/blog-local-posts.js"
      - "js/supabase-config.js"

permissions:
  contents: write
  pages: write

concurrency:
  group: prerender-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate crawlable blog pages
        run: python scripts/prerender_blog.py

      - name: Check internal links
        run: python scripts/check_links.py

      - name: Commit generated pages
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- pages/blog.html pages/blog robots.txt sitemap.xml)" ]; then
            echo "Blog output is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/blog.html pages/blog robots.txt sitemap.xml
          git commit -m "Update prerendered blog"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
