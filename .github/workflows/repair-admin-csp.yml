name: Repair admin CSP hashes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin/dashboard.html"
      - "scripts/repair_admin_csp.py"
      - ".github/workflows/repair-admin-csp.yml"

permissions:
  contents: write

concurrency:
  group: repair-admin-csp
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recompute dashboard CSP hashes
        run: python scripts/repair_admin_csp.py

      - name: Commit repaired CSP if needed
        run: |
          if [ -z "$(git status --porcelain -- admin/dashboard.html _headers)" ]; then
            echo "Admin CSP hashes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/dashboard.html _headers
          git commit -m "Repair admin dashboard CSP hashes"
          git push
