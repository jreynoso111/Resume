<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https://xxrllcpoklgavakmzhnb.supabase.co; media-src 'self' data: blob: https://xxrllcpoklgavakmzhnb.supabase.co; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://xxrllcpoklgavakmzhnb.supabase.co; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | Juan R. Reynoso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css?v=51" />
  <style>
    .auth-wrap { max-width: 460px; margin: 48px auto 24px; }
    .auth-card { border: 1px solid var(--border-subtle); background: var(--bg-soft); border-radius: 14px; padding: 18px; box-shadow: var(--card-shadow); }
    .auth-title { margin: 0 0 8px; color: var(--accent-strong); font-size: 24px; }
    .auth-sub { margin: 0 0 14px; color: var(--text-muted); font-size: 13px; }
    .auth-field { display: grid; gap: 6px; margin-bottom: 10px; }
    .auth-field label { color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .auth-actions { display: grid; gap: 8px; margin-top: 12px; }
    .auth-error { margin-top: 10px; color: #b91c1c; font-size: 13px; min-height: 18px; }
    .auth-ok { margin-top: 10px; color: var(--accent-strong); font-size: 13px; min-height: 18px; }
    .auth-links { margin-top: 12px; font-size: 13px; color: var(--text-muted); }
    .auth-spacer { height: 24px; }
  </style>
</head>

<body>
  <div class="page">
    <header id="site-header" data-variant="home" data-active=""></header>

    <main id="top">
      <section class="hero">
        <div class="shell">
          <div class="auth-wrap">
            <article class="auth-card">
              <h1 class="auth-title">Reset password</h1>

              <div id="reset-request-panel">
                <p class="auth-sub">Enter the email address associated with your account. We will send you a secure recovery link.</p>
                <form id="reset-request-form" novalidate>
                  <div class="auth-field">
                    <label for="reset-email">Email</label>
                    <input id="reset-email" class="cc-input" type="email" autocomplete="email" required />
                  </div>
                  <div class="auth-actions">
                    <button id="reset-request-submit" class="btn-primary" type="submit">Send recovery email</button>
                  </div>
                </form>
              </div>

              <div id="reset-update-panel" hidden>
                <form id="reset-update-form" novalidate>
                  <div class="auth-field">
                    <label for="reset-password">New password</label>
                    <input id="reset-password" class="cc-input" type="password" autocomplete="new-password" minlength="12" required />
                  </div>
                  <div class="auth-field">
                    <label for="reset-password-confirm">Confirm new password</label>
                    <input id="reset-password-confirm" class="cc-input" type="password" autocomplete="new-password" minlength="12" required />
                  </div>
                  <div class="auth-actions">
                    <button id="reset-update-submit" class="btn-primary" type="submit">Update password</button>
                  </div>
                </form>
              </div>

              <div id="reset-error" class="auth-error" role="alert" aria-live="assertive"></div>
              <div id="reset-ok" class="auth-ok" role="status" aria-live="polite"></div>

              <div class="auth-links">
                <a href="login.html" style="color: var(--accent-strong);">Back to login</a>
              </div>
            </article>
          </div>
          <div class="auth-spacer"></div>
        </div>
      </section>
    </main>

    <footer id="site-footer" data-root-path=""></footer>
  </div>

  <script src="assets/js/auth.js?v=3"></script>
  <script src="assets/js/account-pages.js?v=2"></script>
  <script src="js/header.js?v=17"></script>
  <script src="js/footer.js?v=26"></script>
  <script src="js/site-shell.js?v=7"></script>
</body>

</html>
